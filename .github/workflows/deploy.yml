name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-oracle-cloud
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff — real errors only)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest -q tests/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase REPO
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LC }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Create dummy .env file
        run: |
          echo "DISCORD_BOT_TOKEN=dummy" >> .env
          echo "TMDB_API_KEY=dummy" >> .env
          echo "ALPHA_VANTAGE_API_KEY=dummy" >> .env
          echo "OPENWEATHERMAP_API_KEY=dummy" >> .env

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bot.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Downcase REPO
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Create .env file from secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_DATABASE_SECRET: ${{ secrets.FIREBASE_DATABASE_SECRET }}
          TIMER_OWNER_ID: ${{ secrets.TIMER_OWNER_ID }}
          DISCORD_SYNC_SECRET: ${{ secrets.DISCORD_SYNC_SECRET }}
          TIMER_AUTH_PASSWORD: ${{ secrets.TIMER_AUTH_PASSWORD }}
        run: |
          printf '%s' "$ENV_FILE_CONTENT" > .env
          awk '
            /^TMDB_API_KEY=/ { next }
            /^FIREBASE_DATABASE_URL=/ { next }
            /^FIREBASE_DATABASE_SECRET=/ { next }
            /^TIMER_OWNER_ID=/ { next }
            /^DISCORD_SYNC_SECRET=/ { next }
            /^TIMER_AUTH_PASSWORD=/ { next }
            { print }
          ' .env > .env.tmp && mv .env.tmp .env
          [ -n "$TMDB_API_KEY" ] && echo "TMDB_API_KEY=$TMDB_API_KEY" >> .env
          [ -n "$FIREBASE_DATABASE_URL" ] && echo "FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL" >> .env
          [ -n "$FIREBASE_DATABASE_SECRET" ] && echo "FIREBASE_DATABASE_SECRET=$FIREBASE_DATABASE_SECRET" >> .env
          [ -n "$TIMER_OWNER_ID" ] && echo "TIMER_OWNER_ID=$TIMER_OWNER_ID" >> .env
          [ -n "$DISCORD_SYNC_SECRET" ] && echo "DISCORD_SYNC_SECRET=$DISCORD_SYNC_SECRET" >> .env
          [ -n "$TIMER_AUTH_PASSWORD" ] && echo "TIMER_AUTH_PASSWORD=$TIMER_AUTH_PASSWORD" >> .env
          chmod 600 .env

      - name: Copy .env to server
        run: |
          scp .env "${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}:~/.env"

      - name: Deploy over SSH (no action container)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.REPO_LC }}:latest
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | ssh "${{ secrets.OCI_USERNAME }}@${{ secrets.OCI_HOST }}" "bash -lc 'set -euo pipefail
          chmod 600 ~/.env || true
          docker login \"$REGISTRY\" -u \"$ACTOR\" --password-stdin
          docker pull \"$IMAGE\"
          docker stop -t 30 bot-container || true
          docker rm bot-container || true
          mkdir -p \"\$HOME/data\"
          chmod -R 777 \"\$HOME/data\" || true
          docker run -d \
            --name bot-container \
            --restart unless-stopped \
            -v \"\$HOME/data:/app/data\" \
            --env-file \"\$HOME/.env\" \
            -p 5000:5000 \
            \"$IMAGE\"
          docker image prune -f
          '"
