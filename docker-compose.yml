services:
  discordbot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    container_name: discordbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
