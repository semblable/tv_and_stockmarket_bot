services:
  discordbot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    container_name: bot-container
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      bot-net:
        aliases:
          - bot-container
          - discordbot

  caddy:
    image: caddy:alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - discordbot
    networks:
      - bot-net

networks:
  bot-net:
    name: bot-net

volumes:
  caddy_data:
  caddy_config:
